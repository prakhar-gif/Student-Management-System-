{% extends "base.html" %}{% block title %}Edit Student{% endblock %}
{% block content %}
<div class="container"><div class="card narrow"><h1>Edit Student</h1><p>ID: {{student['student_id']}}</p>
<form method="post" class="form-grid">
<div><label>Name</label><input name="name" value="{{student['name']}}" required></div><div><label>Email</label><input type="email" name="email" value="{{student['email']}}" required></div>
<div><label>Phone</label><input name="phone" value="{{student['phone'] or ''}}"></div><div><label>Department</label><select name="department">{% for d in ['Computer Science','Information Technology','Electronics','Mechanical','Civil'] %}<option {% if student['department']==d %}selected{% endif %}>{{d}}</option>{% endfor %}</select></div>
<div><label>Semester</label><select name="semester">{% for i in range(1,9) %}<option value="{{i}}" {% if student['semester']==i %}selected{% endif %}>{{i}}</option>{% endfor %}</select></div>
<div><label>Date of Birth</label><input type="date" name="date_of_birth" value="{{student['date_of_birth'] or ''}}"></div>
<div class="full"><label>Address</label><input name="address" value="{{student['address'] or ''}}"></div>
<div class="full"><label>New Password (optional)</label><input type="password" name="password"></div>
<div class="full"><button class="btn">Save Changes</button></div>
</form></div></div>
{% endblock %}
