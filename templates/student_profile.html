{% extends "base.html" %}{% block title %}Profile{% endblock %}
{% block content %}
<div class="container"><div class="card narrow"><h1>My Profile</h1><p>Student ID: {{student['student_id']}}</p>
<div class="profile"><h2>{{student['name']}}</h2><p>{{student['email']}}</p><p>{{student['department']}} · Semester {{student['semester']}}</p></div>
<form method="post" class="form-grid"><div><label>Phone</label><input name="phone" value="{{student['phone'] or ''}}"></div><div><label>Date of Birth</label><input type="date" name="date_of_birth" value="{{student['date_of_birth'] or ''}}"></div><div class="full"><label>Address</label><input name="address" value="{{student['address'] or ''}}"></div><div class="full"><button class="btn">Update Profile</button></div></form>
</div></div>
{% endblock %}
